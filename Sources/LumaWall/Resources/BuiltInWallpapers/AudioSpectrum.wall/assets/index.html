<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#03040b}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let audio={level:0,bass:0,mid:0,treble:0,spectrum:[]},mouse={x:.5,y:.5},props={speed:.75,height:1,accent:'#5B8CFF'},smooth=new Array(32).fill(.02);
LumaWall.on('audio',v=>audio=v||audio);LumaWall.on('mouse',v=>mouse=v);LumaWall.on('properties',v=>Object.assign(props,v||{}));
function resize(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d}addEventListener('resize',resize);resize();
function rgb(h){h=(h||'#5B8CFF').replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function draw(t){g.clearRect(0,0,c.width,c.height);const [r,gg,b]=rgb(props.accent);const grad=g.createLinearGradient(0,c.height,0,0);grad.addColorStop(0,`rgba(${r},${gg},${b},.95)`);grad.addColorStop(1,'rgba(255,70,220,.85)');const src=(audio.spectrum&&audio.spectrum.length)?audio.spectrum:Array.from({length:32},(_,i)=>.05+.03*Math.sin(t*.002+i*.6));const alpha=Math.max(.05,Math.min(.95,1-(+props.speed||.75)));for(let i=0;i<32;i++)smooth[i]+=((src[i]||0)-smooth[i])*(.08+alpha*.45);const pad=c.width*.08,w=(c.width-pad*2)/32;for(let i=0;i<32;i++){const boost=1+Math.max(0,1-Math.abs((i+.5)/32-mouse.x)*8)*.25;const h=Math.max(2,smooth[i]*c.height*.72*(+props.height||1)*boost);g.fillStyle=grad;g.fillRect(pad+i*w+1,c.height-h,w-3,h);g.fillStyle=`rgba(${r},${gg},${b},.09)`;g.fillRect(pad+i*w+1,c.height,w-3,-h*1.8)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
