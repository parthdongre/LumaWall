<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#010604}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let cols=[],last=0,mouse={x:.5,y:.5},audio={level:0,bass:0};let p={speed:1,density:1,accent:'#39FF88'};
LumaWall.on('mouse',v=>mouse=v);LumaWall.on('audio',v=>audio=v||audio);LumaWall.on('properties',v=>Object.assign(p,v||{}));
function resize(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;const count=Math.max(20,Math.floor(c.width/(18/Math.max(.4,+p.density||1))));cols=Array.from({length:count},(_,i)=>cols[i]??Math.random()*c.height)}addEventListener('resize',resize);resize();
const chars='01アイウエオカキクケコサシスセソ0123456789';
function draw(t){const dt=Math.min(40,t-last);last=t;x.fillStyle='rgba(0,6,4,.12)';x.fillRect(0,0,c.width,c.height);const size=16*(devicePixelRatio||1);x.font=size+'px monospace';x.textAlign='center';const speed=(+p.speed||1)*(1+(audio.bass||0)*.8);for(let i=0;i<cols.length;i++){const xx=(i+.5)*c.width/cols.length;const near=1+Math.max(0,1-Math.abs(xx/c.width-mouse.x)*7)*1.7;x.fillStyle=p.accent||'#39FF88';x.globalAlpha=.35+.65*Math.random();x.fillText(chars[(Math.random()*chars.length)|0],xx,cols[i]);cols[i]+=dt*.09*speed*near;if(cols[i]>c.height+40||Math.random()<.002)cols[i]=-Math.random()*c.height*.35}x.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
