<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">LumaWall — native live wallpapers for macOS</title>
  <desc id="desc">A dark product banner showing colorful live wallpaper cards for LumaWall.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset=".48" stop-color="#101327"/>
      <stop offset="1" stop-color="#07151c"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".65">
      <stop offset="0" stop-color="#48f4ff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#14a9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".7">
      <stop offset=".25" stop-color="#ffc85b" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#ff66da" stop-opacity=".65"/>
      <stop offset=".58" stop-color="#6b235d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#080910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#41ecff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#41ecff"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset=".8" stop-color="#41ecff"/>
      <stop offset="1" stop-color="#41ecff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="card1"><rect x="790" y="78" width="250" height="165" rx="26"/></clipPath>
    <clipPath id="card2"><rect x="1062" y="118" width="250" height="165" rx="26"/></clipPath>
    <clipPath id="card3"><rect x="872" y="270" width="250" height="165" rx="26"/></clipPath>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1065" cy="160" r="280" fill="url(#glowA)" opacity=".18" filter="url(#blur20)"/>
  <circle cx="1180" cy="415" r="240" fill="url(#glowB)" opacity=".12" filter="url(#blur20)"/>

  <g transform="translate(88 104)">
    <rect width="84" height="84" rx="22" fill="#11182b" stroke="#2b3b61"/>
    <path d="M18 55c12-29 18-29 28 0 8-18 13-24 20-24" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="70" font-weight="800" fill="#f7f8ff" letter-spacing="-2">LumaWall</text>
    <text x="2" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="500" fill="#aeb6ca">Your desktop, alive.</text>
    <text x="2" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#7f8ca7">Native live wallpapers for macOS — Metal, WebGL, video &amp; audio reactive.</text>

    <g transform="translate(0 266)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">
      <rect width="112" height="36" rx="18" fill="#141a28" stroke="#2d374d"/><text x="56" y="23" text-anchor="middle" fill="#d7e5ff">macOS 14+</text>
      <rect x="124" width="102" height="36" rx="18" fill="#141a28" stroke="#2d374d"/><text x="175" y="23" text-anchor="middle" fill="#d7e5ff">Swift 6</text>
      <rect x="238" width="94" height="36" rx="18" fill="#141a28" stroke="#2d374d"/><text x="285" y="23" text-anchor="middle" fill="#d7e5ff">Metal</text>
      <rect x="344" width="122" height="36" rx="18" fill="#141a28" stroke="#2d374d"/><text x="405" y="23" text-anchor="middle" fill="#d7e5ff">Multi-display</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <g clip-path="url(#card1)">
      <rect x="790" y="78" width="250" height="165" rx="26" fill="#06131a"/>
      <circle cx="920" cy="150" r="125" fill="url(#glowA)" opacity=".45"/>
      <path d="M770 166 C820 98 850 220 900 142 S980 221 1060 120" fill="none" stroke="#61f5ff" stroke-width="9" stroke-linecap="round"/>
      <path d="M770 166 C820 98 850 220 900 142 S980 221 1060 120" fill="none" stroke="#79ffff" stroke-opacity=".22" stroke-width="24" filter="url(#blur20)"/>
    </g>
    <rect x="790" y="78" width="250" height="165" rx="26" fill="none" stroke="#263347"/>
    <text x="812" y="272" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#eef5ff">Aurora</text>
    <text x="812" y="297" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#73eaff">METAL · AUDIO</text>

    <g clip-path="url(#card2)">
      <rect x="1062" y="118" width="250" height="165" rx="26" fill="#05060a"/>
      <circle cx="1188" cy="201" r="72" fill="none" stroke="#ffc85b" stroke-width="7"/>
      <circle cx="1188" cy="201" r="82" fill="none" stroke="#ffc85b" stroke-opacity=".2" stroke-width="20" filter="url(#blur20)"/>
      <rect x="1082" y="198" width="212" height="5" rx="3" fill="url(#line)"/>
      <circle cx="1138" cy="200" r="16" fill="#ff65df" opacity=".72" filter="url(#blur20)"/>
      <circle cx="1238" cy="200" r="16" fill="#ff65df" opacity=".72" filter="url(#blur20)"/>
      <g fill="#b9c9ff" opacity=".75">
        <circle cx="1102" cy="147" r="2"/><circle cx="1148" cy="132" r="2"/><circle cx="1272" cy="154" r="2"/><circle cx="1290" cy="235" r="2"/><circle cx="1107" cy="245" r="2"/>
      </g>
    </g>
    <rect x="1062" y="118" width="250" height="165" rx="26" fill="none" stroke="#2b2f42"/>
    <text x="1084" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#eef5ff">Event Horizon</text>
    <text x="1084" y="337" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ff94e7">METAL · AUDIO</text>

    <g clip-path="url(#card3)">
      <rect x="872" y="270" width="250" height="165" rx="26" fill="#050510"/>
      <path d="M910 262 C940 305 908 328 944 364 S935 420 970 448" stroke="#8b74ff" stroke-width="5" fill="none"/>
      <path d="M965 258 C996 302 956 328 1000 365 S985 414 1022 447" stroke="#de7cff" stroke-width="4" fill="none"/>
      <path d="M1026 258 C1051 294 1014 325 1057 359 S1047 412 1081 445" stroke="#6576ff" stroke-width="4" fill="none"/>
      <circle cx="998" cy="346" r="96" fill="#635bff" opacity=".13" filter="url(#blur20)"/>
    </g>
    <rect x="872" y="270" width="250" height="165" rx="26" fill="none" stroke="#292646"/>
    <text x="894" y="464" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#eef5ff">Electric Storm</text>
    <text x="894" y="489" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#aa9cff">METAL · AUDIO</text>
  </g>
</svg>