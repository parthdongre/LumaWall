name: Release LumaWall

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.4.0"
        required: true
        default: "0.4.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release scripts
        run: |
          bash -n scripts/package-macos.sh
          bash -n scripts/notarize-macos.sh
          bash -n scripts/verify-release.sh

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Require public-release credentials
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          PKG_SIGN_IDENTITY: ${{ secrets.PKG_SIGN_IDENTITY }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APP_SIGN_IDENTITY"
          test -n "$PKG_SIGN_IDENTITY"
          test -n "$NOTARY_PRIVATE_KEY"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"

      - name: Import Developer ID certificates
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/lumawall-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lumawall-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH"             -k "$KEYCHAIN_PATH"             -P "$MACOS_CERTIFICATE_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/pkgbuild             -T /usr/bin/productbuild
          security set-key-partition-list             -S apple-tool:,apple:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "LUMAWALL_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package app, DMG and PKG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          PKG_SIGN_IDENTITY: ${{ secrets.PKG_SIGN_IDENTITY }}
        run: |
          chmod +x scripts/package-macos.sh
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            export APP_SIGN_IDENTITY="-"
            export PKG_SIGN_IDENTITY=""
          fi
          ./scripts/package-macos.sh

      - name: Notarize and staple public release
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_FILE"
          chmod 600 "$NOTARY_KEY_FILE"

          export NOTARY_KEY_FILE
          chmod +x scripts/notarize-macos.sh
          ./scripts/notarize-macos.sh

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/verify-release.sh
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            export REQUIRE_DEVELOPER_ID=1
            export REQUIRE_NOTARIZED=1
          fi
          ./scripts/verify-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaWall-${{ steps.version.outputs.version }}-macOS
          path: |
            dist/LumaWall.app
            dist/LumaWall-${{ steps.version.outputs.version }}-macOS.zip
            dist/LumaWall-${{ steps.version.outputs.version }}.dmg
            dist/LumaWall-${{ steps.version.outputs.version }}.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME"             "dist/LumaWall-$VERSION-macOS.zip"             "dist/LumaWall-$VERSION.dmg"             "dist/LumaWall-$VERSION.pkg"             "dist/SHA256SUMS.txt"             --title "LumaWall $VERSION"             --generate-notes

      - name: Remove temporary signing keychain
        if: ${{ always() && github.ref_type == 'tag' }}
        run: |
          if [[ -n "${LUMAWALL_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$LUMAWALL_SIGNING_KEYCHAIN" || true
          fi
