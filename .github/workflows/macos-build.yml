name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Swift version
        run: swift --version

      - name: Validate release scripts
        run: |
          bash -n scripts/package-macos.sh
          bash -n scripts/notarize-macos.sh
          bash -n scripts/verify-release.sh

      - name: Build
        run: swift build

      - name: Tests
        run: swift test

      - name: Capture actual LumaWall UI
        if: github.event_name == 'push'
        env:
          LUMAWALL_SCREENSHOT_DIR: ${{ runner.temp }}/lumawall-screenshots
        run: |
          mkdir -p "$LUMAWALL_SCREENSHOT_DIR"
          set +e
          swift test
          TEST_STATUS=$?
          set -e
          ls -lh "$LUMAWALL_SCREENSHOT_DIR"
          if ! compgen -G "$LUMAWALL_SCREENSHOT_DIR/*.png" > /dev/null; then
            echo "UI capture produced no screenshots (swift test exit $TEST_STATUS)." >&2
            exit ${TEST_STATUS:-1}
          fi
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "UI screenshots were produced; ignoring the headless AppKit post-test teardown status $TEST_STATUS."
          fi

      - name: Upload UI screenshots
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LumaWall-UI-${{ github.sha }}
          path: ${{ runner.temp }}/lumawall-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Package installable macOS artifacts
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - name: Verify packaged release artifacts
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/verify-release.sh
          ./scripts/verify-release.sh

      - name: Verify finished DMG contents
        if: github.event_name == 'push'
        run: |
          VERIFY_MOUNT="$RUNNER_TEMP/lumawall-dmg-verify"
          mkdir -p "$VERIFY_MOUNT"
          hdiutil attach "$PWD/dist/LumaWall-${{ steps.version.outputs.version }}.dmg" -readonly -noverify -noautoopen -mountpoint "$VERIFY_MOUNT" >/dev/null

          test -d "$VERIFY_MOUNT/LumaWall.app"
          test -L "$VERIFY_MOUNT/Applications"
          test -f "$VERIFY_MOUNT/.background/background.png"
          test -f "$VERIFY_MOUNT/.DS_Store"
          test -d "$VERIFY_MOUNT/LumaWall.app/Contents/Resources/LumaWall_LumaWall.bundle"

          hdiutil detach "$VERIFY_MOUNT" -quiet

      - name: Smoke-launch packaged LumaWall.app
        if: github.event_name == 'push'
        run: |
          defaults write dev.parthdongre.LumaWall onboarding.completed -bool true
          defaults write dev.parthdongre.LumaWall startup.restoreAssignments -bool false
          open -na "$PWD/dist/LumaWall.app"
          sleep 5
          if ! pgrep -x LumaWall >/dev/null; then
            echo "Packaged LumaWall.app did not remain running." >&2
            exit 1
          fi
          pkill -x LumaWall || true

      - name: Upload macOS installer artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LumaWall-macOS-${{ github.sha }}
          path: |
            dist/LumaWall.app
            dist/LumaWall-${{ steps.version.outputs.version }}-macOS.zip
            dist/LumaWall-${{ steps.version.outputs.version }}.dmg
            dist/LumaWall-${{ steps.version.outputs.version }}.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
