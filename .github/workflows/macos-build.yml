name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Tests
        run: swift test

      - name: Package installable macOS artifacts
        if: github.event_name == 'push'
        env:
          VERSION: 0.3.1
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - name: Upload macOS installer artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LumaWall-macOS-${{ github.sha }}
          path: |
            dist/LumaWall.app
            dist/LumaWall-0.3.1-macOS.zip
            dist/LumaWall-0.3.1.dmg
            dist/LumaWall-0.3.1.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
