<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.querySelector('#c'), gl=canvas.getContext('webgl');
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 r,m;uniform float t,a,b;uniform vec3 accent;uniform float mode;void main(){vec2 uv=(gl_FragCoord.xy/r-.5)*vec2(r.x/r.y,1.);float d=length(uv-m*.18);float v=0.;if(mode<.5)v=sin(uv.x*12.+t)+sin((uv.x+uv.y)*7.-t*.7);else if(mode<1.5)v=sin(d*35.-t*3.);else v=sin(uv.x*8.+t)+cos(uv.y*9.-t*.8)+sin((uv.x+uv.y)*6.);v=.5+.5*sin(v+a*4.);float glow=.08/max(abs(v-uv.y*.35),.03);vec3 col=vec3(.015,.02,.04)+accent*glow*(1.+b*2.);gl_FragColor=vec4(col,1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
let mouse={x:.5,y:.5},audio={level:0,bass:0},props={speed:1,reactive:true,accent:'#6C63FF',mode:'waves'},paused=false,start=performance.now();
function hex(h){h=h.replace('#','');const n=parseInt(h,16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();
window.addEventListener('lumawall:mouse',e=>mouse=e.detail);window.addEventListener('lumawall:audio',e=>audio=e.detail);window.addEventListener('lumawall:properties',e=>props={...props,...e.detail});window.addEventListener('lumawall:pause',()=>paused=true);window.addEventListener('lumawall:resume',()=>paused=false);
function draw(now){requestAnimationFrame(draw);if(paused)return;const speed=Number(props.speed||1), reactive=props.reactive!==false;gl.uniform2f(gl.getUniformLocation(pr,'r'),canvas.width,canvas.height);gl.uniform2f(gl.getUniformLocation(pr,'m'),mouse.x-.5,mouse.y-.5);gl.uniform1f(gl.getUniformLocation(pr,'t'),(now-start)/1000*speed);gl.uniform1f(gl.getUniformLocation(pr,'a'),reactive?(audio.level||0):0);gl.uniform1f(gl.getUniformLocation(pr,'b'),reactive?(audio.bass||0):0);gl.uniform3fv(gl.getUniformLocation(pr,'accent'),hex(props.accent||'#6C63FF'));gl.uniform1f(gl.getUniformLocation(pr,'mode'),props.mode==='rings'?1:props.mode==='plasma'?2:0);gl.drawArrays(gl.TRIANGLES,0,3)}requestAnimationFrame(draw);
</script></body></html>
